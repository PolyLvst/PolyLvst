name: generate pacman game

on:
  schedule:
    # - cron: "0 0 * * *" # every 24 hours at midnight UTC
    # 00:00 gets delayed heavily on github crowded runners, real run will execute at 09:00 GMT +7
    # ~ PolyLvst - ngelag lama banget cuy
    # 23:13 UTC = 06:13 AM WIB (GMT+7)
    - cron: "23 13 * * *"
  workflow_dispatch: # allows manual trigger
  push:
    branches:
      - main # run on push to main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        env:
          NODE_OPTIONS: "--max-old-space-size=7168"
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Push pacman-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
