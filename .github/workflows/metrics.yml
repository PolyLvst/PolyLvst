name: generate metrics cards

on:
  schedule:
    - cron: "0 1 * * *" # every 24 hours at 01:00 UTC
  workflow_dispatch: # allows manual trigger
  push:
    branches:
      - main # run on push to main

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # the fork may rebuild its docker image
    permissions:
      contents: write

    # Nixie-tube styling shared by both cards (matches assets/headers/*.svg)
    env:
      NIXIE_CSS: |
        svg{font-family:Consolas,'Courier New',monospace;color:#e8c39a}
        .items-wrapper{background:#0b0b0b repeating-linear-gradient(0deg,rgba(255,159,28,.05) 0 1px,transparent 1px 3px);border:1px solid rgba(255,159,28,.35);border-radius:6px;box-sizing:border-box;height:205px;overflow:hidden;padding:2px 0 8px}
        h2{color:#ff9f1c;text-transform:uppercase;letter-spacing:2px;font-weight:700;text-shadow:0 0 6px rgba(255,159,28,.6)}
        h2.field svg{fill:#ff9f1c}
        h3{color:rgba(255,159,28,.6);text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:400}
        .language small{color:rgba(255,159,28,.6)}
        .bar{filter:drop-shadow(0 0 3px rgba(255,159,28,.35))}
        .achievements .achievement[class] .title{color:#ff9f1c;animation:none}
        .achievements .achievement[class] .title .prefix{color:rgba(255,159,28,.6)}
        .achievements .achievement[class] .gauge.info{color:#ff9f1c}
        .achievements .achievement[class] .value{background-color:rgba(255,159,28,.15);color:#ff9f1c}
        .achievement .icon [stroke]:not([stroke=none]){stroke:#ff9f1c}
        .achievement .icon svg[mask] [fill]:not([fill=none]){fill:#ff9f1c}
        .achievement .icon{filter:drop-shadow(0 0 3px rgba(255,159,28,.55))}
        .achievement.a .icon,.achievement.secret .icon{opacity:.9}
        .achievement.b .icon{opacity:.75}
        .achievement.c .icon,.achievement.x .icon{opacity:.55}

    # gh-metrics/metrics is the maintained fork: lowlighter/metrics hasn't
    # released since 2023, and its achievements query hits the removed
    # Projects (classic) API while its repo paging drops data on timeouts
    steps:
      - name: Generate languages card
        uses: gh-metrics/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: PolyLvst
          filename: metrics.languages.svg
          committer_branch: metrics
          base: ""
          repositories_batch: 25 # smaller pages stay under GitHub's API timeout
          config_timezone: Asia/Jakarta
          plugin_languages: yes
          plugin_languages_limit: 12
          plugin_languages_details: percentage
          plugin_languages_ignored: html, css, scss
          plugin_languages_skipped: ${{ secrets.METRICS_SKIPPED_REPOS }} # private repo names kept out of the public workflow
          plugin_languages_colors: 0:#ffc14d, 1:#ffb02e, 2:#ff9f1c, 3:#ff8f0a, 4:#ff8000, 5:#f76d0c, 6:#ec5c15, 7:#e04c1d, 8:#d33f24, 9:#c4342a, 10:#b32a2e, 11:#a02230 # amber to red
          extras_css: ${{ env.NIXIE_CSS }}

      - name: Generate achievements card
        uses: gh-metrics/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: PolyLvst
          filename: metrics.achievements.svg
          committer_branch: metrics
          base: ""
          config_timezone: Asia/Jakarta
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C # show more, lower ranks render dimmer
          plugin_achievements_limit: 10 # two rows of 5, fits the fixed 205px panel height
          plugin_achievements_secrets: yes
          extras_css: ${{ env.NIXIE_CSS }}
