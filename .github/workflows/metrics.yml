name: generate metrics cards

on:
  schedule:
    - cron: "0 1 * * *" # every 24 hours at 01:00 UTC
  workflow_dispatch: # allows manual trigger
  push:
    branches:
      - main # run on push to main

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # the fork may rebuild its docker image
    permissions:
      contents: write

    # gh-metrics/metrics is the maintained fork: lowlighter/metrics hasn't
    # released since 2023, and its achievements query hits the removed
    # Projects (classic) API while its repo paging drops data on timeouts
    steps:
      - name: Generate languages card
        uses: gh-metrics/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: PolyLvst
          filename: metrics.languages.svg
          committer_branch: metrics
          base: ""
          repositories_batch: 25 # smaller pages stay under GitHub's API timeout
          config_timezone: Asia/Jakarta
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_ignored: html, css, scss

      - name: Generate achievements card
        uses: gh-metrics/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: PolyLvst
          filename: metrics.achievements.svg
          committer_branch: metrics
          base: ""
          config_timezone: Asia/Jakarta
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: B
          plugin_achievements_secrets: yes
