name: generate metrics cards

on:
  schedule:
    - cron: "0 1 * * *" # every 24 hours at 01:00 UTC
  workflow_dispatch: # allows manual trigger
  push:
    branches:
      - main # run on push to main

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate languages card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: PolyLvst
          filename: metrics.languages.svg
          committer_branch: metrics
          base: ""
          config_timezone: Asia/Jakarta
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_ignored: html, css, scss

      - name: Generate achievements card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: PolyLvst
          filename: metrics.achievements.svg
          committer_branch: metrics
          base: ""
          config_timezone: Asia/Jakarta
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: B
          plugin_achievements_secrets: yes
